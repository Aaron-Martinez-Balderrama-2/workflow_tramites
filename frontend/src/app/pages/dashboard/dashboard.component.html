<div class="flex h-screen w-full bg-bg-light dark:bg-bg-dark overflow-hidden transition-colors duration-300">
  
  <!-- Left Sidebar (Corporate Style) -->
  <aside [class.w-64]="isLeftSidebarOpen" [class.w-16]="!isLeftSidebarOpen" class="bg-surface-light dark:bg-surface-dark border-r border-borderCol-light dark:border-borderCol-dark flex flex-col z-20 transition-all duration-300 relative">
    
    <button (click)="toggleLeftSidebar()" class="absolute -right-3 top-20 w-6 h-6 rounded-full bg-white dark:bg-slate-700 border border-borderCol-light dark:border-borderCol-dark shadow flex items-center justify-center text-slate-500 z-30 hover:text-primary-600 transition-colors">
      <svg *ngIf="isLeftSidebarOpen" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
      <svg *ngIf="!isLeftSidebarOpen" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
    </button>

    <div class="h-16 flex items-center px-4 border-b border-borderCol-light dark:border-borderCol-dark overflow-hidden whitespace-nowrap">
      <div class="min-w-[32px] w-8 h-8 rounded bg-primary-600 flex items-center justify-center font-bold text-white shadow-sm">
        PF
      </div>
      <h1 *ngIf="isLeftSidebarOpen" class="ml-3 text-lg font-bold text-slate-800 dark:text-white tracking-wide transition-opacity duration-300">PolicyFlow</h1>
    </div>
    
    <nav class="flex-1 py-6 px-2 space-y-1 overflow-hidden whitespace-nowrap">
      <div *ngIf="isLeftSidebarOpen" class="text-xs font-semibold text-slate-400 dark:text-slate-500 uppercase tracking-wider mb-2 px-2 transition-opacity">Sistema BPM</div>
      
      <!-- CU-01 -->
      <a (click)="switchView('usuarios')" [class.bg-primary-50]="currentView === 'usuarios'" class="cursor-pointer flex items-center px-2 py-2 text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800/50 rounded-md transition-all">
        <span class="min-w-[20px] w-5 h-5 mx-1">👥</span>
        <span *ngIf="isLeftSidebarOpen" class="ml-3">Usuarios (CU-01)</span>
      </a>

      <!-- CU-02 -->
      <a (click)="switchView('areas')" [class.bg-primary-50]="currentView === 'areas'" class="cursor-pointer flex items-center px-2 py-2 text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800/50 rounded-md transition-all">
        <span class="min-w-[20px] w-5 h-5 mx-1">🏢</span>
        <span *ngIf="isLeftSidebarOpen" class="ml-3">Áreas (CU-02)</span>
      </a>

      <!-- CU-04 -->
      <a (click)="switchView('modelador')" [class.bg-primary-50]="currentView === 'modelador'" class="cursor-pointer flex items-center px-2 py-2 text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800/50 rounded-md transition-all">
        <span class="min-w-[20px] w-5 h-5 mx-1">✨</span>
        <span *ngIf="isLeftSidebarOpen" class="ml-3">Modelador (CU-04)</span>
      </a>

      <!-- CU-03, 05, 06, 07, 08 -->
      <a (click)="switchView('tramites')" [class.bg-primary-50]="currentView === 'tramites'" class="cursor-pointer flex items-center px-2 py-2 text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800/50 rounded-md transition-all">
        <span class="min-w-[20px] w-5 h-5 mx-1">📁</span>
        <span *ngIf="isLeftSidebarOpen" class="ml-3">Trámites Activos</span>
      </a>

      <!-- MANUAL -->
      <a (click)="switchView('manual')" [class.bg-primary-50]="currentView === 'manual'" class="cursor-pointer flex items-center px-2 py-2 text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800/50 rounded-md transition-all">
        <span class="min-w-[20px] w-5 h-5 mx-1">📖</span>
        <span *ngIf="isLeftSidebarOpen" class="ml-3">Manual de Uso</span>
      </a>
    </nav>
  </aside>

  <!-- Main Area -->
  <main class="flex-1 flex flex-col relative bg-slate-50 dark:bg-slate-900 transition-colors duration-300">
    <!-- Top toolbar -->
    <header class="h-16 bg-surface-light dark:bg-surface-dark border-b border-borderCol-light dark:border-borderCol-dark flex items-center justify-between px-6 z-10 transition-colors duration-300 shrink-0">
      <div class="flex items-center">
        <h2 class="text-slate-800 dark:text-white font-semibold text-lg flex items-center">
          <span *ngIf="currentView === 'modelador'">Diseñador de Política: Solicitud de Medidor</span>
          <span *ngIf="currentView === 'usuarios'">Administración de Usuarios</span>
          <span *ngIf="currentView === 'areas'">Gestión de Áreas de Trabajo</span>
          <span *ngIf="currentView === 'tramites'">Gestor de Instancias y Trámites</span>
          <span *ngIf="currentView === 'manual'">Centro de Ayuda y Manuales</span>
        </h2>
        <span *ngIf="currentView === 'modelador'" class="ml-4 px-2.5 py-0.5 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-700 text-xs font-medium">Borrador</span>
      </div>
      <div class="flex items-center space-x-4">
        <!-- Theme Toggle -->
        <button (click)="toggleTheme()" class="p-2 text-slate-500 hover:text-slate-700 dark:text-slate-400 dark:hover:text-slate-200 rounded-full hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
          <svg *ngIf="!isDarkMode" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
          <svg *ngIf="isDarkMode" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
        </button>
        <button *ngIf="currentView === 'modelador'" class="px-4 py-1.5 rounded bg-surface-light dark:bg-surface-dark border border-borderCol-light dark:border-borderCol-dark text-slate-700 dark:text-slate-300 text-sm font-medium hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors shadow-sm">Guardar Borrador</button>
        <button *ngIf="currentView === 'modelador'" (click)="guardarSistema()" class="px-4 py-1.5 rounded bg-primary-600 text-white font-medium text-sm hover:bg-primary-700 transition-colors shadow-sm">
          Generar Sistema
        </button>
      </div>
    </header>
    
    <!-- Dynamic Views -->
    <div class="flex-1 relative overflow-auto">
      <!-- Usamos [class.hidden] en vez de *ngIf para no matar la instancia de JointJS -->
      <app-lienzo-diseno [class.hidden]="currentView !== 'modelador'" class="block w-full h-full"></app-lienzo-diseno>
      
      <div *ngIf="currentView === 'usuarios'" class="p-6 h-full">
        <app-usuarios></app-usuarios>
      </div>
      
      <div *ngIf="currentView === 'areas'" class="p-6 h-full">
        <app-areas></app-areas>
      </div>
      
      <div *ngIf="currentView === 'tramites'" class="p-6 h-full">
        <app-tramites></app-tramites>
      </div>

      <div *ngIf="currentView === 'manual'" class="h-full">
        <app-manual></app-manual>
      </div>
    </div>
  </main>

  <!-- Right Sidebar: AI Copilot -->
  <aside *ngIf="currentView === 'modelador'" [class.w-80]="isRightSidebarOpen" [class.w-0]="!isRightSidebarOpen" class="bg-surface-light dark:bg-surface-dark border-l border-borderCol-light dark:border-borderCol-dark shadow-xl z-20 flex flex-col transition-all duration-300 relative overflow-visible shrink-0">
    
    <!-- Collapse Button Fixed -->
    <div class="absolute top-20 -left-6 w-6 h-12 z-30">
        <button (click)="toggleRightSidebar()" class="w-6 h-6 rounded-full bg-white dark:bg-slate-700 border border-borderCol-light dark:border-borderCol-dark shadow flex items-center justify-center text-slate-500 hover:text-primary-600 transition-colors relative">
          <svg *ngIf="isRightSidebarOpen" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
          <svg *ngIf="!isRightSidebarOpen" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
        </button>
    </div>

    <div class="w-80 h-full flex flex-col absolute top-0 left-0" [class.opacity-0]="!isRightSidebarOpen" [class.pointer-events-none]="!isRightSidebarOpen">
      <app-sidebar-ia 
        class="flex-1 overflow-hidden"
        (solicitarGrafo)="onSolicitarGrafo()"
        (aplicarCambios)="onAplicarCambios($event)">
      </app-sidebar-ia>
    </div>
  </aside>

</div>
