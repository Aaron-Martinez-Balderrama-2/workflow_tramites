version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: workflow-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  ollama:
    image: ollama/ollama:latest
    container_name: workflow-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    # Comando para que descargue el modelo al iniciar si no existe
    entrypoint: /bin/sh -c "ollama serve & sleep 10 && ollama pull llama3 && wait"

  backend:
    build: ./backend
    container_name: workflow-backend
    ports:
      - "8080:8080"
    depends_on:
      - mongodb
      - ollama
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/workflow_db

  frontend:
    build: ./frontend
    container_name: workflow-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mongo-data:
  ollama-data:
