version: '3.8'

services:
  mongo:
    image: mongo:latest
    container_name: workflow_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  ai-service:
    build: 
      context: ./ai-service
    container_name: workflow_ai
    restart: unless-stopped
    ports:
      - "8005:8005"
    depends_on:
      - mongo

  backend:
    build: 
      context: ./backend
    container_name: workflow_backend
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://mongo:27017/test
      - AI_SERVICE_HOST=ai-service
    depends_on:
      - mongo
      - ai-service

  frontend:
    build: 
      context: ./frontend
    container_name: workflow_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mongo_data:
